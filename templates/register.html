<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register · Knowledge Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "dark") document.documentElement.classList.add("dark-init");
        else if (saved === "light") document.documentElement.classList.add("light-init");
      })();
    </script>
  </head>
  <body>
    <div class="auth-layout">
      <div class="auth-card">
        <a class="brand brand--auth" href="{{ url_for('index') }}">
          <span class="brand-mark">K</span>
          <span>Knowledge Check</span>
        </a>
        <div class="auth-toolbar">
          <div class="language-switch auth-language">
            <button class="language-button" type="button" data-language="en">EN</button>
            <button class="language-button" type="button" data-language="ru">RU</button>
          </div>
          <button class="theme-toggle" type="button">Theme</button>
        </div>
        <h1 data-en="Create an account" data-ru="Создать аккаунт">Create an account</h1>
        <p class="subtitle" data-en="Your test history and mistake reviews will be stored in your account." data-ru="История тестов и разбор ошибок будут храниться в вашем аккаунте.">Your test history and mistake reviews will be stored in your account.</p>
        {% if error %}
        <div class="form-alert">{{ error }}</div>
        {% endif %}
        <form method="post" class="auth-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <input type="hidden" name="next" value="{{ next_url }}" />
          <label class="control-label" for="username" data-en="Username" data-ru="Логин">Username</label>
          <input id="username" name="username" class="text-input" type="text" required />
          <label class="control-label" for="password" data-en="Password" data-ru="Пароль">Password</label>
          <input id="password" name="password" class="text-input" type="password" required />
          <label class="control-label" for="password_repeat" data-en="Repeat password" data-ru="Повторите пароль">Repeat password</label>
          <input id="password_repeat" name="password_repeat" class="text-input" type="password" required />
          <button class="button button--primary" type="submit" data-en="Create account" data-ru="Создать аккаунт">Create account</button>
        </form>
        <div class="auth-links">
          <span data-en="Already registered?" data-ru="Уже есть аккаунт?">Already registered?</span>
          <a href="{{ url_for('login', next=next_url) }}" data-en="Log in" data-ru="Войти">Log in</a>
        </div>
      </div>
    </div>
    <script src="{{ url_for('static', filename='page-i18n.js') }}"></script>
  </body>
</html>
